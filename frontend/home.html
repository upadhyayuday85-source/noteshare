<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - NoteShare</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-body">
  <nav class="navbar">
    <a class="logo" href="home.html">NoteShare</a>
    <div class="nav-right">
      <a class="nav-link" href="upload.html">Upload Notes</a>
      <span id="welcome"></span>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </nav>

  <main class="content">
    <h2>Latest notes</h2>

    <div class="filters">
      <input type="text" id="search" placeholder="Search by title or subject">
      <select id="filterBranch">
        <option value="">All branches</option>
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>EE</option>
        <option>ME</option>
        <option>CE</option>
        <option>Other</option>
      </select>
      <select id="filterSemester">
        <option value="">All semesters</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>
    </div>

    <div id="notesList" class="notes-grid"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
